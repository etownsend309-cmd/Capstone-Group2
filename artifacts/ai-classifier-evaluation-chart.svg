  <!-- Takeaway banner -->
  <rect x="64" y="752" width="1472" height="76" rx="10" fill="#3b3b3b"/>
  <text x="90" y="797" font-size="21" fill="#fff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><tspan font-weight="700" fill="#f0a82a">Takeaway:</tspan> strong on clear-cut clauses, weaker on nuanced ones. Local rules fill any category the model skips, and a reviewer decides every flag.</text>

  <text x="64" y="866" font-size="15" fill="#777" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">CUAD is the development set, so these results are not independent holdout evidence. Source: artifacts/ai-classifier-evaluation.md</text>
